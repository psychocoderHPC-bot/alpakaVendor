name: CI Build and Test

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('ref-{0}', github.ref) }}
  cancel-in-progress: true

env:
  alpaka_cmake_flags: >-
    -Dalpaka_COMPILE_PEDANTIC=ON
    -Dalpaka_TESTS=OFF
    -Dalpaka_BENCHMARKS=OFF
    -Dalpaka_EXAMPLES=OFF
    -Dalpaka_HEADERCHECKS=OFF
    -Dalpaka_LOG=dynamic
    -Dalpaka_FAST_MATH=OFF
    -DalpakaV_TESTS=ON
    -DalpakaV_DOCS=ON

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip
          pip install pre-commit==4.3.0
          pre-commit install
          pre-commit run --all-files --show-diff-on-failure

  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        config:
          # GCC CPU
          - { compiler: gcc, version: "12", cuda: "no", hip: "no", container: "ubuntu:24.04",
              env: { APCI_DEVICE_COMPILER: gcc@12, APCI_CMAKE: 3.28.3, APCI_RUN_CTEST: ON } }
          - { compiler: gcc, version: "13", cuda: "no", hip: "no", container: "ubuntu:24.04",
              env: { APCI_DEVICE_COMPILER: gcc@13, APCI_CMAKE: 3.28.3, APCI_RUN_CTEST: ON } }
          - { compiler: gcc, version: "14", cuda: "no", hip: "no", container: "ubuntu:24.04",
              env: { APCI_DEVICE_COMPILER: gcc@14, APCI_CMAKE: 3.28.3, APCI_RUN_CTEST: ON } }
          - { compiler: gcc, version: "15", cuda: "no", hip: "no", container: "gcc:15.1.0",
              env: { APCI_DEVICE_COMPILER: gcc@15, APCI_CMAKE: 3.28.3, APCI_RUN_CTEST: ON } }
          - { compiler: gcc, version: "16", cuda: "no", hip: "no", container: "gcc:16.2.0",
              env: { APCI_DEVICE_COMPILER: gcc@16, APCI_CMAKE: 3.28.3, APCI_RUN_CTEST: ON } }
          # Clang CPU
          - { compiler: clang, version: "17", cuda: "no", hip: "no", container: "ubuntu:24.04",
              env: { APCI_DEVICE_COMPILER: clang@17, APCI_CMAKE: 3.28.3, APCI_RUN_CTEST: ON } }
          - { compiler: clang, version: "18", cuda: "no", hip: "no", container: "ubuntu:24.04",
              env: { APCI_DEVICE_COMPILER: clang@18, APCI_CMAKE: 3.28.3, APCI_RUN_CTEST: ON } }
          - { compiler: clang, version: "19", cuda: "no", hip: "no", container: "ubuntu:24.04",
              env: { APCI_DEVICE_COMPILER: clang@19, APCI_CMAKE: 3.28.3, APCI_RUN_CTEST: ON } }
          - { compiler: clang, version: "20", cuda: "no", hip: "no", container: "ubuntu:24.04",
              env: { APCI_DEVICE_COMPILER: clang@20, APCI_CMAKE: 3.28.3, APCI_RUN_CTEST: ON } }
          - { compiler: clang, version: "21", cuda: "no", hip: "no", container: "ubuntu:24.04",
              env: { APCI_DEVICE_COMPILER: clang@21, APCI_CMAKE: 3.28.3, APCI_RUN_CTEST: ON } }
          # NVCC CUDA
          - { compiler: nvcc, version: "", cuda: "12.5", hip: "no", container: "nvidia/cuda:12.5.1-devel-ubuntu24.04",
              env: { APCI_DEVICE_COMPILER: nvcc@12.5, APCI_CMAKE: 3.28.3, APCI_RUN_CTEST: OFF } }
          - { compiler: nvcc, version: "", cuda: "12.6", hip: "no", container: "nvidia/cuda:12.6.3-devel-ubuntu24.04",
              env: { APCI_DEVICE_COMPILER: nvcc@12.6, APCI_CMAKE: 3.28.3, APCI_RUN_CTEST: OFF } }
          - { compiler: nvcc, version: "", cuda: "12.8", hip: "no", container: "nvidia/cuda:12.8.1-devel-ubuntu24.04",
              env: { APCI_DEVICE_COMPILER: nvcc@12.8, APCI_CMAKE: 3.28.3, APCI_RUN_CTEST: OFF } }
          - { compiler: nvcc, version: "", cuda: "12.9", hip: "no", container: "nvidia/cuda:12.9.1-devel-ubuntu24.04",
              env: { APCI_DEVICE_COMPILER: nvcc@12.9, APCI_CMAKE: 3.28.3, APCI_RUN_CTEST: OFF } }
          - { compiler: nvcc, version: "", cuda: "13.0", hip: "no", container: "nvidia/cuda:13.0.0-devel-ubuntu24.04",
              env: { APCI_DEVICE_COMPILER: nvcc@13.0, APCI_CMAKE: 3.28.3, APCI_RUN_CTEST: OFF } }
          - { compiler: nvcc, version: "", cuda: "13.1", hip: "no", container: "nvidia/cuda:13.1.0-devel-ubuntu24.04",
              env: { APCI_DEVICE_COMPILER: nvcc@13.1, APCI_CMAKE: 3.28.3, APCI_RUN_CTEST: OFF } }
          - { compiler: nvcc, version: "", cuda: "13.2", hip: "no", container: "nvidia/cuda:13.2.0-devel-ubuntu24.04",
              env: { APCI_DEVICE_COMPILER: nvcc@13.2, APCI_CMAKE: 3.28.3, APCI_RUN_CTEST: OFF } }
          - { compiler: nvcc, version: "", cuda: "13.3", hip: "no", container: "nvidia/cuda:13.3.0-devel-ubuntu24.04",
              env: { APCI_DEVICE_COMPILER: nvcc@13.3, APCI_CMAKE: 3.28.3, APCI_RUN_CTEST: OFF } }
          - { compiler: nvcc, version: "", cuda: "13.4", hip: "no", container: "nvidia/cuda:13.4.1-devel-ubuntu24.04",
              env: { APCI_DEVICE_COMPILER: nvcc@13.4, APCI_CMAKE: 3.28.3, APCI_RUN_CTEST: OFF } }
          # Clang-CUDA (device compile with clang)
          - { compiler: clang, version: "20", cuda: "12.8", hip: "no", container: "nvidia/cuda:12.8.1-devel-ubuntu24.04",
              env: { APCI_DEVICE_COMPILER: clang@20, APCI_CMAKE: 3.28.3, APCI_RUN_CTEST: OFF } }
          - { compiler: clang, version: "21", cuda: "12.8", hip: "no", container: "nvidia/cuda:12.8.1-devel-ubuntu24.04",
              env: { APCI_DEVICE_COMPILER: clang@21, APCI_CMAKE: 3.28.3, APCI_RUN_CTEST: OFF } }
          # Clang with ROCm HIP
          - { compiler: clang, version: "18", cuda: "no", hip: "6.2.4", container: "rocm/dev-ubuntu-24.04:6.2.4",
              env: { APCI_DEVICE_COMPILER: clang@18, APCI_CMAKE: 3.28.3, APCI_HIP: 6.2.4, APCI_RUN_CTEST: OFF } }
          - { compiler: clang, version: "18", cuda: "no", hip: "6.3.4", container: "rocm/dev-ubuntu-24.04:6.3.4",
              env: { APCI_DEVICE_COMPILER: clang@18, APCI_CMAKE: 3.28.3, APCI_HIP: 6.3.4, APCI_RUN_CTEST: OFF } }
          - { compiler: clang, version: "19", cuda: "no", hip: "6.4.2", container: "rocm/dev-ubuntu-24.04:6.4.2",
              env: { APCI_DEVICE_COMPILER: clang@19, APCI_CMAKE: 3.28.3, APCI_HIP: 6.4.2, APCI_RUN_CTEST: OFF } }
          - { compiler: clang, version: "20", cuda: "no", hip: "7.0", container: "rocm/dev-ubuntu-24.04:7.0",
              env: { APCI_DEVICE_COMPILER: clang@20, APCI_CMAKE: 3.28.3, APCI_HIP: 7.0, APCI_RUN_CTEST: OFF } }
          - { compiler: clang, version: "20", cuda: "no", hip: "7.1", container: "rocm/dev-ubuntu-24.04:7.1",
              env: { APCI_DEVICE_COMPILER: clang@20, APCI_CMAKE: 3.28.3, APCI_HIP: 7.1, APCI_RUN_CTEST: OFF } }
          - { compiler: clang, version: "22", cuda: "no", hip: "7.2", container: "rocm/dev-ubuntu-24.04:7.2",
              env: { APCI_DEVICE_COMPILER: clang@22, APCI_CMAKE: 3.28.3, APCI_HIP: 7.2, APCI_RUN_CTEST: OFF } }
          - { compiler: clang, version: "23", cuda: "no", hip: "7.14", container: "rocm/dev-ubuntu-24.04:7.14.1-full",
              rocm_packages: "preinstalled", env: { APCI_DEVICE_COMPILER: clang@23, APCI_CMAKE: 3.28.3, APCI_HIP: 7.14, APCI_RUN_CTEST: OFF } }
          - { compiler: clang, version: "23", cuda: "no", hip: "10.0", container: "rocm/dev-ubuntu-24.04:10.0.0-full",
              rocm_packages: "preinstalled", env: { APCI_DEVICE_COMPILER: clang@23, APCI_CMAKE: 3.28.3, APCI_HIP: 10.0, APCI_RUN_CTEST: OFF } }
          # Sanitizers
          - { compiler: clang, version: "21", cuda: "no", hip: "no", container: "ubuntu:24.04", sanitizer: "asan",
              env: { APCI_DEVICE_COMPILER: clang@21, APCI_CMAKE: 3.28.3, APCI_RUN_CTEST: ON } }
          - { compiler: clang, version: "21", cuda: "no", hip: "no", container: "ubuntu:24.04", sanitizer: "tsan",
              env: { APCI_DEVICE_COMPILER: clang@21, APCI_CMAKE: 3.28.3, APCI_RUN_CTEST: ON } }
          - { compiler: clang, version: "21", cuda: "no", hip: "no", container: "ubuntu:24.04", sanitizer: "lsan",
              env: { APCI_DEVICE_COMPILER: clang@21, APCI_CMAKE: 3.28.3, APCI_RUN_CTEST: ON } }
          - { compiler: clang, version: "21", cuda: "no", hip: "no", container: "ubuntu:24.04", sanitizer: "ubsan",
              env: { APCI_DEVICE_COMPILER: clang@21, APCI_CMAKE: 3.28.3, APCI_RUN_CTEST: ON } }
          - { compiler: gcc, version: "15", cuda: "no", hip: "no", container: "gcc:15.1.0", sanitizer: "asan",
              env: { APCI_DEVICE_COMPILER: gcc@15, APCI_CMAKE: 3.25.1, APCI_RUN_CTEST: ON } }
          - { compiler: gcc, version: "15", cuda: "no", hip: "no", container: "gcc:15.1.0", sanitizer: "tsan",
              env: { APCI_DEVICE_COMPILER: gcc@15, APCI_CMAKE: 3.25.1, APCI_RUN_CTEST: ON } }
          - { compiler: gcc, version: "15", cuda: "no", hip: "no", container: "gcc:15.1.0", sanitizer: "lsan",
              env: { APCI_DEVICE_COMPILER: gcc@15, APCI_CMAKE: 3.25.1, APCI_RUN_CTEST: ON } }
          - { compiler: gcc, version: "15", cuda: "no", hip: "no", container: "gcc:15.1.0", sanitizer: "ubsan",
              env: { APCI_DEVICE_COMPILER: gcc@15, APCI_CMAKE: 3.25.1, APCI_RUN_CTEST: ON } }
          # Intel oneAPI SYCL CPU
          - { compiler: icpx, version: "2025.1", cuda: "no", hip: "no", container: "intel/oneapi-hpckit:2025.1.3-0-devel-ubuntu24.04",
              env: { APCI_DEVICE_COMPILER: icpx@2025.1, APCI_CMAKE: 3.28.3, APCI_RUN_CTEST: ON } }
          - { compiler: icpx, version: "2025.2", cuda: "no", hip: "no", container: "intel/oneapi-hpckit:2025.2.2-0-devel-ubuntu24.04",
              env: { APCI_DEVICE_COMPILER: icpx@2025.2, APCI_CMAKE: 3.28.3, APCI_RUN_CTEST: ON } }
          - { compiler: icpx, version: "2025.3", cuda: "no", hip: "no", container: "intel/oneapi-hpckit:2025.3.0-0-devel-ubuntu24.04",
              env: { APCI_DEVICE_COMPILER: icpx@2025.3, APCI_CMAKE: 3.28.3, APCI_RUN_CTEST: ON } }
          - { compiler: icpx, version: "2026.0", cuda: "no", hip: "no", container: "intel/oneapi:2026.0.0-devel-ubuntu24.04",
              env: { APCI_DEVICE_COMPILER: icpx@2026.0, APCI_CMAKE: 3.28.3, APCI_RUN_CTEST: ON } }
          - { compiler: icpx, version: "2026.1", cuda: "no", hip: "no", container: "intel/oneapi:2026.1.0-devel-ubuntu24.04",
              env: { APCI_DEVICE_COMPILER: icpx@2026.1, APCI_CMAKE: 3.28.3, APCI_RUN_CTEST: ON } }
      fail-fast: false

    container:
      image: ${{ matrix.config.container }}

    env: ${{ matrix.config.env }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Export GitHub Actions variables
        run: |
          echo "APCI_GIT_URL=https://github.com/${{ github.repository }}.git" >> $GITHUB_ENV
          echo "APCI_BRANCH_NAME=${{ github.ref_name }}" >> $GITHUB_ENV

      - name: Install base dependencies
        run: |
          apt-get update
          apt-get install -y build-essential ninja-build git pkg-config curl wget ca-certificates gnupg
          if grep -q '^ID=ubuntu$' /etc/os-release; then
            apt-get install -y software-properties-common python3-launchpadlib
          fi

      - name: Install CMake
        run: |
          CMAKE_VERSION=${APCI_CMAKE}
          curl -fsSL "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz" | tar xz -C /opt
          echo "/opt/cmake-${CMAKE_VERSION}-linux-x86_64/bin" >> $GITHUB_PATH

      - name: Install FFTW
        run: apt-get install -y libfftw3-dev

      - name: Install OpenBLAS
        run: apt-get install -y libopenblas-dev

      - name: Install oneMKL
        if: matrix.config.compiler == 'icpx'
        run: |
          apt-get install -y intel-oneapi-mkl-devel

      - name: Install GCC
        if: matrix.config.compiler == 'gcc'
        run: |
          GCC_VERSION=${{ matrix.config.version }}
          if [ "$GCC_VERSION" != "" ]; then
            # install gcc only if not already available, pre installed gcc can not be called with the version number as postfix
            if [ $(gcc --version | awk '{print($3)}' | head -n 1 | cut -d"." -f1) -ne ${GCC_VERSION} ] ; then
              # install requested GCC if it is not already available
              if ! command -v gcc-${GCC_VERSION} >/dev/null 2>&1; then
                add-apt-repository -y ppa:ubuntu-toolchain-r/test
                apt-get update
                apt-get install -y gcc-${GCC_VERSION} g++-${GCC_VERSION}
              fi
            fi
          fi

      - name: Install Clang
        if: matrix.config.compiler == 'clang' && matrix.config.hip == 'no'
        run: |
          CLANG_VERSION=${{ matrix.config.version }}
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | apt-key add -
          # Use the appropriate LLVM repository for the version
          if [ "$CLANG_VERSION" -ge 19 ]; then
            echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-${CLANG_VERSION} main" > /etc/apt/sources.list.d/llvm.list
          else
            echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble main" > /etc/apt/sources.list.d/llvm.list
          fi
          apt-get update
          apt-get install -y clang-${CLANG_VERSION} libomp-${CLANG_VERSION}-dev lld-${CLANG_VERSION}

      - name: Install ROCm
        if: matrix.config.hip != 'no'
        run: |
          if [ "${{ matrix.config.rocm_packages }}" != "preinstalled" ]; then
            apt-get install -y rocfft rocblas
          fi
          # ROCm is pre-installed in the ROCm container
          ROCM_PATH=/opt/rocm
          echo "ROCM_PATH=${ROCM_PATH}" >> $GITHUB_ENV
          echo "${ROCM_PATH}/bin" >> $GITHUB_PATH

      - name: Install hwloc
        run: |
          apt-get install -y libhwloc-dev

      - name: Set sanitizer options
        if: matrix.config.sanitizer != ''
        run: |
          export "SANITIZERS_DIR=$(pwd)/sanitizer"
          echo "ASAN_OPTIONS=detect_leaks=1:suppressions=${SANITIZERS_DIR}/asan_suppressions.txt" >> $GITHUB_ENV
          echo "TSAN_OPTIONS=suppressions=${SANITIZERS_DIR}/tsan_suppressions.txt,ignore_noninstrumented_modules=1" >> $GITHUB_ENV
          echo "LSAN_OPTIONS=suppressions=${SANITIZERS_DIR}/lsan_suppressions.txt" >> $GITHUB_ENV
          echo "UBSAN_OPTIONS=suppressions=${SANITIZERS_DIR}/ubsan_suppressions.txt" >> $GITHUB_ENV

      # required to to avoid compile error: 'FATAL: ThreadSanitizer: unexpected memory mapping'
      # see: https://stackoverflow.com/questions/77850769/fatal-threadsanitizer-unexpected-memory-mapping-when-running-on-linux-kernels
      - name: Set tsan kernel configuration
        if: matrix.config.sanitizer == 'tsan'
        run: |
          if [ -w /proc/sys/vm/mmap_rnd_bits ]; then
            sysctl vm.mmap_rnd_bits=28
          else
            echo "Skipping vm.mmap_rnd_bits: not writable in this container"
          fi

      - name: Configure CMake
        run: |
          # Set compiler
          if [ "${{ matrix.config.compiler }}" = "gcc" ]; then
            if [ "${{ matrix.config.version }}" != "" ] && which gcc-${{ matrix.config.version }} > /dev/null 2>&1; then
              export CC=gcc-${{ matrix.config.version }}
              export CXX=g++-${{ matrix.config.version }}
            else
              export CC=gcc
              export CXX=g++
            fi
          elif [ "${{ matrix.config.compiler }}" = "clang" ]; then
            if [ "${{ matrix.config.hip }}" = "no" ]; then
              export CC=clang-${{ matrix.config.version }}
              export CXX=clang++-${{ matrix.config.version }}
            else
              export ROCM_PATH=/opt/rocm
              export CMAKE_PREFIX_PATH=$ROCM_PATH:$CMAKE_PREFIX_PATH
              export HIP_PLATFORM="amd"
              export HIP_DEVICE_LIB_PATH=${ROCM_PATH}/amdgcn/bitcode
              export HSA_PATH=$ROCM_PATH
              export PATH=${ROCM_PATH}/bin:$PATH
              export PATH=${ROCM_PATH}/llvm/bin:$PATH
              export CC=clang
              export CXX=clang++
            fi
          elif [ "${{ matrix.config.compiler }}" = "icpx" ]; then
            source /opt/intel/oneapi/setvars.sh > /dev/null 2>&1 || true
            export CC=icx
            export CXX=icpx
          fi

          # Build CMake flags
          CMAKE_FLAGS="${alpaka_cmake_flags}"
          CMAKE_FLAGS="${CMAKE_FLAGS} -Dalpaka_DEP_OMP=ON"
          CMAKE_FLAGS="${CMAKE_FLAGS} -Dalpaka_DEP_HWLOC=ON -Dalpaka_HOST_MemPinningCanFail=ON"

          # Backend-specific flags
          if [ "${{ matrix.config.cuda }}" != "no" ]; then
            CMAKE_FLAGS="${CMAKE_FLAGS} -Dalpaka_DEP_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=80"
            CMAKE_FLAGS="${CMAKE_FLAGS} -DalpakaV_DEP_CUFFT=ON -DalpakaV_DEP_CUBLAS=ON"
          fi
          if [ "${{ matrix.config.compiler }}" = "clang" ] && [ "${{ matrix.config.cuda }}" != "no" ]; then
            CMAKE_FLAGS="${CMAKE_FLAGS} -DCMAKE_CUDA_COMPILER=$CXX -DCMAKE_CUDA_HOST_COMPILER=$CXX"
            CMAKE_FLAGS="${CMAKE_FLAGS} -Dalpaka_SUPPRESS_TARGET_WARNING=ON -Dalpaka_DEP_OMP=OFF"
          fi
          if [ "${{ matrix.config.hip }}" != "no" ]; then
            CMAKE_FLAGS="${CMAKE_FLAGS} -DCMAKE_CXX_COMPILER=clang++ -Dalpaka_DEP_HIP=ON -Dalpaka_DEP_OMP=OFF"
            CMAKE_FLAGS="${CMAKE_FLAGS} -DCMAKE_HIP_ARCHITECTURES=gfx906 -DAMDGPU_TARGETS=gfx906"
            CMAKE_FLAGS="${CMAKE_FLAGS} -DalpakaV_DEP_ROCFFT=ON -DalpakaV_DEP_ROCBLAS=ON"
          fi
          if [ "${{ matrix.config.compiler }}" = "icpx" ]; then
            CMAKE_FLAGS="${CMAKE_FLAGS} -Dalpaka_DEP_ONEAPI=ON -Dalpaka_ONEAPI_Cpu=ON -Dalpaka_ONEAPI_IntelGpu=OFF"
            CMAKE_FLAGS="${CMAKE_FLAGS} -Dalpaka_DEP_OMP=OFF -DalpakaV_DEP_ONEMKL=ON"
          fi

          # Sanitizer flags
          if [ "${{ matrix.config.sanitizer }}" = "asan" ]; then
            CMAKE_FLAGS="${CMAKE_FLAGS} -Dalpaka_ASAN=ON"
          elif [ "${{ matrix.config.sanitizer }}" = "tsan" ]; then
            CMAKE_FLAGS="${CMAKE_FLAGS} -Dalpaka_TSAN=ON"
          elif [ "${{ matrix.config.sanitizer }}" = "lsan" ]; then
            CMAKE_FLAGS="${CMAKE_FLAGS} -Dalpaka_LSAN=ON"
          elif [ "${{ matrix.config.sanitizer }}" = "ubsan" ]; then
            CMAKE_FLAGS="${CMAKE_FLAGS} -Dalpaka_UBSAN=ON"
          fi

          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            ${CMAKE_FLAGS}

      - name: Build
        run: cmake --build build -j

      - name: Run tests
        if: matrix.config.cuda == 'no' && matrix.config.hip == 'no'
        run: ctest --test-dir build --output-on-failure

  ci-jobmatrix:
    name: ci-jobmatrix
    runs-on: ubuntu-latest
    needs: [ci]
    if: always()
    steps:
      - name: Check matrix result
        run: |
          if [ "${{ needs.ci.result }}" != "success" ]; then
            echo "Matrix CI failed: ${{ needs.ci.result }}"
            exit 1
          fi
